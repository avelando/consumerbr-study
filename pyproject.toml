[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "consumerbr-resolution-prediction"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "duckdb",
    "numpy",
    "requests",
    "scikit-learn",
    "tqdm"
]

[tool.setuptools.packages.find]
where = ["src"]