[build-system]
requires = ["setuptools>=80,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "consumerbr-resolution-prediction"
version = "0.2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.4,<2",
    "huggingface-hub>=0.34,<2",
    "joblib>=1.5,<2",
    "numpy>=2.2,<3",
    "pandas>=2.2,<4",
    "pyarrow>=20,<26",
    "requests>=2.32,<3",
    "scikit-learn>=1.7,<2",
    "scipy>=1.15,<2",
    "torch>=2.11,<2.14",
    "transformers>=5,<6",
    "tqdm>=4.67,<5"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true